[project]
name = "fpl-agent"
version = "0.1.0"
description = "Fantasy Premier League decision pipeline built for a headless AI agent to operate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
keywords = ["fantasy-premier-league", "fpl", "optimization", "agent", "sports-analytics"]
dependencies = [
    "pandas>=3.0.5",
    "pulp>=3.3.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[project.scripts]
fpl = "fpl_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpl_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
