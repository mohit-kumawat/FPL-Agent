# Copy to squad.yaml and fill in with your own team. squad.yaml is gitignored.
#
# Why purchase_price matters: the public FPL API never exposes selling prices.
# Selling price = purchase + floor((current - purchase) / 2), in 0.1m steps.
# Without accurate purchase prices, every transfer budget calculation is wrong.
#
# Leave `players: []` before your first squad is picked — the pipeline then runs
# in build mode (`fpl build`) instead of transfer mode.

entry_id: null            # your FPL entry id: the number in fantasy.premierleague.com/entry/<ID>/event/1
player_id: null           # optional: your FPL account player id (not the entry id)
season: "2026-27"
bank: 100.0               # £m unspent (100.0 when no squad exists yet)
free_transfers: 0         # 0-5; they bank up to 5
# 2026/27 gives TWO full sets of chips — one per half of the season. Suffix 1 is
# the first-half copy (Wildcard/Free Hit GW2-19, Bench Boost/Triple Captain
# GW1-19), suffix 2 the second-half copy (GW20-38). Only ONE chip may be played
# in a gameweek. Remove each name as you use it. An unsuffixed name (`bboost`)
# still works and means "a copy is unused".
chips_available: [wildcard1, freehit1, bboost1, 3xc1,
                  wildcard2, freehit2, bboost2, 3xc2]
strategy_mode: safe       # safe (EP-max, default) | balanced | chase (differential
                          # captain allowed within 1.0 EP; safe pick stays visible)

players: []
# players:
#   - {id: 411, name: Haaland, purchase_price: 15.5}
#   - {id: 426, name: B.Fernandes, purchase_price: 12.0}
#   ... 15 total: 2 GKP, 5 DEF, 5 MID, 3 FWD, max 3 per club
